name: Fourier
description: >-
  Fourier is an energy technology company building on-site, on-demand hydrogen
  production systems. Its core product is a modular, scalable device that generates hydrogen
  where it is needed, removing the transport and storage barriers of conventional hydrogen
  supply. Fourier targets three application areas: long-duration distributed storage for
  renewable energy, alternative fuels for heavy transportation, and cleaner feedstock for
  chemical and manufacturing industries. The company commercially launched its onsite
  hydrogen system in late 2025 and raised an $18.5M Series A led by Paramark Ventures and
  General Catalyst. Fourier is a hardware and infrastructure company and does not currently
  publish a public API, developer portal, SDKs, or other software developer surface.
